name: cd-infra

services:
  postgres:
    image: postgres:18
    container_name: postgres18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env (copiá .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copiá .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env (copiá .env.example)}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/data:/var/lib/postgresql
      # Corre solo cuando el volumen está vacío (crea la base de test)
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cdigital.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - ./docker/pgadmin:/var/lib/pgadmin

  # Bandeja de correo de desarrollo: recibe todo por SMTP y lo muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
      - "${MAIL_PORT:-1025}:1025"

networks:
  default:
    name: cd-net
