name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      # PageProps y LayoutProps se generan: sin esto tsc falla en un checkout limpio.
      - run: npx next typegen
      - run: npx tsc --noEmit

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: DB_CD26_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d DB_CD26_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/DB_CD26_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:db

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: DB_CD26_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d DB_CD26_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/DB_CD26_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3100
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Courroux Digital <no-reply@localhost>
      # Falsos: el E2E solo llega hasta el redirect al proveedor.
      GOOGLE_CLIENT_ID: test-google-id
      GOOGLE_CLIENT_SECRET: test-google-secret
      GITHUB_CLIENT_ID: test-github-id
      GITHUB_CLIENT_SECRET: test-github-secret
      MICROSOFT_CLIENT_ID: test-microsoft-id
      MICROSOFT_CLIENT_SECRET: test-microsoft-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
